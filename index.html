<script>
/* PWA 分享目标 / 快捷方式带进来的参数：先收好，再把地址栏抹干净。
   share_target 给 ?share_title=&share_text=&share_url=；
   快捷方式给 ?go=notes&new=1。

   为什么必须抹掉：这些参数留在地址栏里，每次刷新都会再导入一遍 ——
   同一条链接会在沙滩里堆成一串。会话级就够，它只服务这一次打开。
   URLSearchParams 不存在的老 WebView 直接跳过，页面照常启动。 */
(function () {
  var q = location.search || '';
  if (!/[?&](share_title|share_text|share_url|go|new)=/.test(q)) return;
  try {
    var sp = new URLSearchParams(q);
    var share = {
      title: sp.get('share_title') || '',
      text: sp.get('share_text') || '',
      url: sp.get('share_url') || ''
    };
    if (share.title || share.text || share.url) {
      sessionStorage.setItem('gzt.share_in', JSON.stringify(share));
    }
    var go = sp.get('go') || '';
    if (go) sessionStorage.setItem('gzt.go', JSON.stringify({ mod: go, isNew: sp.get('new') === '1' }));
    ['share_title', 'share_text', 'share_url', 'go', 'new'].forEach(function (k) { sp.delete(k); });
    var rest = sp.toString();
    history.replaceState(null, '', location.pathname + (rest ? '?' + rest : '') + (location.hash || ''));
  } catch (e) { }
})();
</script>

<script>
/* 第一帧的纸色：必须在样式生效前铺好，否则会看见"先宣纸、再换纸"地闪一下。

(function () {
  var bg = '#f7f3ea';
  var meta = { tint: 'xuan', theme: 'auto', custom: null };
  try {
    var raw = localStorage.getItem('gzt.v2');
    if (raw) {
      var d = JSON.parse(raw);
      if (d && d.meta) meta = { tint: d.meta.tint || 'xuan', theme: d.meta.theme || 'auto', custom: d.meta.custom || null };
      else if (d && d.notes && d.notes.length) bg = bg;
    }
  } catch (e) {}
  var mode = meta.theme === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : meta.theme;
  var p = window.Tint.palette(meta.tint, mode, meta.custom);
  var root = document.documentElement;
  Object.keys(p).forEach(function (k) { root.style.setProperty('--' + k, p[k]); });
  root.setAttribute('data-theme', mode);
  root.setAttribute('data-tint', meta.tint);
})();

<script>
/* 手动检查更新：手机「更多」面板里的那一格与「数据同步」页共用这一个实现。
   为什么挂 window 而不放进 js/：拆包脚本只摘 <script src>，内联的这段
   在任何加载顺序下都先可用；而"点了没反应"恰恰是最需要它的时候。
   「有新版本了」是另一条被动提示（下面 SW 注册段），只在真装好新版时冒出来，
   两者不重复：一个是主动查，一个是查到了叫你切。 */
(function () {
  var busy = false;
  function noop() {}
  window.GZT_UPDATE = function (say) {
    if (busy) return;
    busy = true;
    say = typeof say === 'function' ? say : noop;
    say('正在检查…');
    var stopped = false;
    function done() { stopped = true; busy = false; }
    function reloadNow() {
      if (stopped) return;
      done();
      say('正在重新载入…');
      location.reload();
    }
    /* 没装 SW（本地打开、老浏览器）：整页重载本身就是最可靠的更新 */
    if (!('serviceWorker' in navigator)) { reloadNow(); return; }
    try {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (!reg) { reloadNow(); return; }
        var tries = 0;
        function poll() {
          if (stopped) return;
          /* 新 SW 装好会停在 waiting：让它接管，controllerchange 会 reload。
             不能自己再刷一次 —— 两次 reload 叠在一起会把刚写的字丢掉。 */
          if (reg.waiting) {
            done();
            say('发现新版本，正在切换…');
            try { reg.waiting.postMessage('skip-waiting'); }
            catch (e) { location.reload(); }
            return;
          }
          /* update() 之后 installing → installed 是异步的，留 4 次 × 600ms 收网 */
          if (++tries < 4) { setTimeout(poll, 600); return; }
          reloadNow();
        }
        if (reg.waiting) { poll(); return; }       /* 上次没切过去的那版，立刻切 */
        try { Promise.resolve(reg.update()).then(poll, poll); }
        catch (e) { poll(); }
      }).catch(reloadNow);
    } catch (e) { reloadNow(); }
  };
  var btn = document.getElementById('gztUpdateBtn');
  if (btn) btn.addEventListener('click', function () {
    /* 按钮在「更多」浮层里，先收起来，别让它盖住即将重载的页面 */
    document.body.classList.remove('m-more-open');
    var tx = document.getElementById('gztUpdateTx');
    /* 状态文字一律收成三个字，别把这一格撑变形 */
    window.GZT_UPDATE(function (t) { if (tx) tx.textContent = t.length > 3 ? '更新中' : t; });
  });
})();
</script>

<script>
/* 登记 service worker —— 装了 PWA 之后断网也能打开。
   三道保险，缺一个就会在某种环境下抛错、或者把旧版本永久钉住：
   ① 没有 serviceWorker 就退出（file:// 打开、老浏览器、jsdom 测试环境）；
   ② 只在 https 或 localhost 登记 —— 别的环境浏览器会直接拒绝；
   ③ 更新不自动刷：新版本装好之后弹一条"点这里刷新"，
      由人决定什么时候切。自动 reload 会把正在写的字弄丢。 */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var secure = location.protocol === 'https:' ||
    /^(localhost|127\.0\.0\.1)$/.test(location.hostname || '');
  if (!secure) return;

  function offer(w) {
    if (!w || document.querySelector('[data-gzt-update]')) return;
    /* 用 button 而不是 div + onclick：键盘能 Tab 到、回车能触发、
       读屏会念成按钮。padding 12/12 + 行高 20.8 ≈ 44.8px，过 44 那条线。 */
    var bar = document.createElement('button');
    bar.type = 'button';
    bar.setAttribute('data-gzt-update', '1');
    bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:2147483645;cursor:pointer;' +
      'display:block;width:100%;border:0;margin:0;appearance:none;' +
      'background:#3a3428;color:#f4efe4;text-align:center;padding:12px 14px;' +
      'font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif';
    bar.textContent = '有新版本了 —— 点这里刷新';
    bar.onclick = function () { w.postMessage('skip-waiting'); };
    document.body.appendChild(bar);
  }

  var reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloaded) return;                 /* postMessage 之后可能触发多次，只刷一次 */
    reloaded = true;
    location.reload();
  });

  try {
    navigator.serviceWorker.register('sw.js', { scope: './' }).then(function (reg) {
      if (reg.waiting) offer(reg.waiting);          /* 上次没切过去的那版 */
      reg.addEventListener('updatefound', function () {
        var w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', function () {
          /* 有 controller 才说明这是"更新"而不是首次安装 */
          if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w);
        });
      });
    }).catch(function () { /* 登记失败不影响正常使用 */ });
  } catch (e) { }
})();
</script>
